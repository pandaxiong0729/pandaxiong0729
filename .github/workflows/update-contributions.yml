name: Update profile contributions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/contributions.json
      - .github/scripts/update-contributions*.mjs
      - .github/workflows/update-contributions.yml

permissions:
  contents: write

concurrency:
  group: profile-contribution-sync
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'pandaxiong0729/pandaxiong0729'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test status updates and README preservation
        run: node --test .github/scripts/update-contributions.test.mjs
      - name: Refresh contribution statuses
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/update-contributions.mjs
      - name: Commit only when the displayed contributions changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Contribution statuses are unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: sync contribution statuses'
          git push origin HEAD:main
